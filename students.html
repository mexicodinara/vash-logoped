<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои ученики — Ваш Логопед</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #E84FA3; --pink-light: #F7A8D4; --pink-pale: #FDE9F4;
  --pink-dark: #C0397E; --text: #1a1a2e; --gray: #6b7280;
  --border: #f0e6ec; --radius: 16px;
  --green: #1a9e78; --green-pale: #e8f8f1; --green-light: #b2f0e0;
  --blue: #3b82f6; --blue-pale: #eff6ff;
  --yellow: #f59e0b; --yellow-pale: #fffbeb;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito',sans-serif; color:var(--text); background:#f8f9fc; }

/* NAV */
nav {
  position:sticky; top:0; z-index:100;
  background:rgba(255,255,255,0.96); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 40px; height:68px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 2px 20px rgba(232,79,163,0.07);
}
.logo img { height:44px; width:auto; max-width:180px; object-fit:contain; }
.nav-links { display:flex; gap:12px; align-items:center; }
.btn-outline { padding:9px 18px; border:2px solid var(--pink); border-radius:50px; color:var(--pink); font-weight:700; font-size:14px; text-decoration:none; background:white; transition:all 0.2s; cursor:pointer; font-family:'Nunito',sans-serif; }
.btn-outline:hover { background:var(--pink-pale); }
.btn-primary { padding:9px 20px; background:linear-gradient(135deg,var(--pink),var(--pink-dark)); border:none; border-radius:50px; color:white; font-weight:700; font-size:14px; cursor:pointer; text-decoration:none; box-shadow:0 4px 14px rgba(232,79,163,0.35); transition:transform 0.2s; font-family:'Nunito',sans-serif; }
.btn-primary:hover { transform:translateY(-1px); }

/* LAYOUT */
.page-wrap { display:flex; min-height:calc(100vh - 68px); }

/* SIDEBAR — список учеников */
.sidebar {
  width:280px; flex-shrink:0;
  background:white; border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  position:sticky; top:68px; height:calc(100vh - 68px);
}
.sidebar-header {
  padding:20px 20px 12px;
  border-bottom:1px solid var(--border);
}
.sidebar-title {
  font-family:'Unbounded',sans-serif;
  font-size:13px; font-weight:900; color:var(--text);
  margin-bottom:12px;
}
.add-student-btn {
  width:100%; padding:11px;
  background:linear-gradient(135deg,var(--pink),var(--pink-dark));
  border:none; border-radius:12px;
  color:white; font-weight:700; font-size:14px;
  cursor:pointer; font-family:'Nunito',sans-serif;
  transition:opacity 0.2s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.add-student-btn:hover { opacity:0.9; }

.students-list {
  flex:1; overflow-y:auto; padding:12px 12px;
}
.student-card {
  padding:14px 16px; border-radius:14px;
  cursor:pointer; transition:all 0.2s;
  border:1.5px solid transparent;
  margin-bottom:8px;
  display:flex; align-items:center; gap:12px;
}
.student-card:hover { background:var(--pink-pale); border-color:var(--pink-light); }
.student-card.active { background:var(--pink-pale); border-color:var(--pink); }
.student-avatar {
  width:42px; height:42px; flex-shrink:0;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:900;
  color:white;
}
.student-info { flex:1; min-width:0; }
.student-name { font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.student-meta { font-size:12px; color:var(--gray); font-weight:600; margin-top:2px; }
.student-badge {
  font-size:11px; font-weight:700;
  padding:2px 8px; border-radius:10px;
  white-space:nowrap;
}

/* MAIN */
.main { flex:1; padding:32px 36px; overflow-y:auto; }

/* EMPTY STATE */
.empty-state {
  text-align:center; padding:80px 20px;
}
.empty-state .emoji { font-size:64px; margin-bottom:20px; }
.empty-state h2 { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:900; margin-bottom:12px; }
.empty-state p { color:var(--gray); font-size:16px; font-weight:600; margin-bottom:28px; }

/* STUDENT PROFILE */
.profile-header {
  background:white; border-radius:20px;
  border:1.5px solid var(--border);
  padding:28px 32px; margin-bottom:24px;
  display:flex; align-items:center; gap:24px;
}
.profile-avatar {
  width:72px; height:72px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:28px; font-weight:900; color:white;
  flex-shrink:0;
}
.profile-info h2 {
  font-family:'Unbounded',sans-serif; font-size:22px; font-weight:900; margin-bottom:6px;
}
.profile-meta {
  display:flex; gap:12px; flex-wrap:wrap; align-items:center;
}
.meta-chip {
  background:#f5f5f5; color:var(--gray);
  font-size:12px; font-weight:700;
  padding:4px 12px; border-radius:20px;
}
.profile-actions { margin-left:auto; display:flex; gap:10px; }

/* TABS */
.profile-tabs {
  display:flex; gap:4px; margin-bottom:24px;
  background:white; border-radius:14px;
  padding:6px; border:1.5px solid var(--border);
  width:fit-content;
}
.tab-btn {
  padding:10px 20px; border:none; border-radius:10px;
  font-family:'Nunito',sans-serif; font-weight:700; font-size:14px;
  cursor:pointer; transition:all 0.2s; background:transparent;
  color:var(--gray);
}
.tab-btn.active {
  background:linear-gradient(135deg,var(--pink),var(--pink-dark));
  color:white; box-shadow:0 3px 10px rgba(232,79,163,0.3);
}

/* PLAN SECTION */
.section-card {
  background:white; border-radius:20px;
  border:1.5px solid var(--border);
  padding:28px; margin-bottom:20px;
}
.section-card h3 {
  font-family:'Unbounded',sans-serif; font-size:16px; font-weight:900;
  margin-bottom:20px; display:flex; align-items:center; gap:10px;
}

/* PLAN TEXTAREA */
.plan-textarea {
  width:100%; min-height:160px;
  padding:16px; border:1.5px solid var(--border);
  border-radius:14px; font-size:14px;
  font-family:'Nunito',sans-serif; font-weight:600;
  outline:none; resize:vertical;
  transition:border-color 0.2s; line-height:1.7;
  color:var(--text);
}
.plan-textarea:focus { border-color:var(--pink); }
.save-btn {
  margin-top:12px; padding:11px 28px;
  background:linear-gradient(135deg,var(--green),#0d7a5c);
  border:none; border-radius:50px;
  color:white; font-weight:700; font-size:14px;
  cursor:pointer; font-family:'Nunito',sans-serif;
  transition:opacity 0.2s;
  box-shadow:0 3px 10px rgba(26,158,120,0.3);
}
.save-btn:hover { opacity:0.9; }
.saved-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--green-pale); color:var(--green);
  font-size:13px; font-weight:700;
  padding:6px 14px; border-radius:20px;
  margin-left:12px; opacity:0;
  transition:opacity 0.3s;
}
.saved-badge.show { opacity:1; }

/* GAMES LIST */
.games-assigned {
  display:flex; flex-direction:column; gap:10px;
}
.assigned-game {
  display:flex; align-items:center; gap:14px;
  padding:14px 18px; border-radius:14px;
  background:#f8f9fc; border:1.5px solid var(--border);
  transition:border-color 0.2s;
}
.assigned-game:hover { border-color:var(--pink-light); }
.game-status {
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; flex-shrink:0; cursor:pointer;
  transition:all 0.2s;
}
.game-status.done { background:var(--green-pale); color:var(--green); }
.game-status.pending { background:#f0f0f0; color:#999; }
.game-status:hover { transform:scale(1.1); }
.game-info { flex:1; }
.game-name { font-weight:800; font-size:14px; }
.game-cat-label { font-size:12px; color:var(--gray); font-weight:600; margin-top:2px; }
.game-remove { color:#ddd; font-size:18px; cursor:pointer; transition:color 0.2s; background:none; border:none; padding:4px; }
.game-remove:hover { color:#e55; }
.play-link {
  padding:7px 16px; background:linear-gradient(135deg,var(--pink),var(--pink-dark));
  color:white; border-radius:50px; font-size:12px; font-weight:700;
  text-decoration:none; white-space:nowrap;
  transition:opacity 0.2s;
}
.play-link:hover { opacity:0.9; }

/* ADD GAME TO STUDENT */
.add-game-wrap {
  display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;
}
.game-select {
  flex:1; min-width:200px;
  padding:11px 16px; border:1.5px solid var(--border);
  border-radius:12px; font-size:14px;
  font-family:'Nunito',sans-serif; font-weight:600;
  outline:none; transition:border-color 0.2s; background:white;
}
.game-select:focus { border-color:var(--pink); }
.add-game-btn {
  padding:11px 20px; background:var(--pink-pale);
  border:1.5px solid var(--pink-light); border-radius:12px;
  color:var(--pink); font-weight:700; font-size:14px;
  cursor:pointer; font-family:'Nunito',sans-serif;
  transition:all 0.2s; white-space:nowrap;
}
.add-game-btn:hover { background:var(--pink); color:white; }

/* PROGRESS */
.progress-bar-wrap {
  background:#f0f0f0; border-radius:50px; height:8px; margin-bottom:8px;
}
.progress-bar {
  background:linear-gradient(135deg,var(--green),#0d7a5c);
  height:8px; border-radius:50px; transition:width 0.3s;
}
.progress-label { font-size:12px; font-weight:700; color:var(--gray); }

/* NOTES / SESSIONS */
.session-item {
  padding:16px; border-radius:14px;
  border:1.5px solid var(--border); margin-bottom:10px;
  background:#f8f9fc;
}
.session-date { font-size:12px; color:var(--gray); font-weight:700; margin-bottom:8px; }
.session-text { font-size:14px; font-weight:600; line-height:1.65; }
.add-session-wrap { margin-top:12px; }

/* MODAL */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.5);
  z-index:9999; display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-bg.open { display:flex; }
.modal-box {
  background:white; border-radius:24px; padding:40px;
  width:100%; max-width:480px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.modal-box h3 { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:900; margin-bottom:24px; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; color:var(--text); }
.form-group input, .form-group select, .form-group textarea {
  width:100%; padding:12px 16px; border:1.5px solid var(--border);
  border-radius:12px; font-size:14px; font-family:'Nunito',sans-serif;
  font-weight:600; outline:none; transition:border-color 0.2s; background:white;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--pink); }
.modal-actions { display:flex; gap:12px; margin-top:24px; }
.modal-actions button { flex:1; }

/* TOAST */
.toast {
  position:fixed; bottom:24px; right:24px; z-index:99999;
  background:linear-gradient(135deg,var(--green),#0d7a5c);
  color:white; padding:14px 24px; border-radius:16px;
  font-weight:700; font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);
  display:none; animation:slideUp 0.3s ease;
}
@keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* COLORS */
.color-1 { background:linear-gradient(135deg,#E84FA3,#C0397E); }
.color-2 { background:linear-gradient(135deg,#3b82f6,#1d4ed8); }
.color-3 { background:linear-gradient(135deg,#10b981,#047857); }
.color-4 { background:linear-gradient(135deg,#f59e0b,#d97706); }
.color-5 { background:linear-gradient(135deg,#8b5cf6,#7c3aed); }
.color-6 { background:linear-gradient(135deg,#ec4899,#db2777); }

@media(max-width:768px) {
  .sidebar { display:none; }
  .main { padding:20px; }
  nav { padding:0 20px; }
}

  nav a img, nav img { 
    height:44px!important; width:auto!important; 
    max-width:180px!important; object-fit:contain!important;
    display:block!important; max-height:44px!important;
  }
</style>

<script>
// ─── ДАННЫЕ ───────────────────────────────────────
const COLORS = ['color-1','color-2','color-3','color-4','color-5','color-6'];

// Загружаем данные
let students = JSON.parse(localStorage.getItem('vl_students') || '[]');
let games = JSON.parse(localStorage.getItem('vl_games') || '[]');
let currentStudentId = null;
let currentTab = 'plan';

function save() {
  localStorage.setItem('vl_students', JSON.stringify(students));
}

// ─── УЧЕНИКИ ──────────────────────────────────────
function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
}

function openAddStudent() {
  document.getElementById('modal-add-student').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Ставим сегодняшнюю дату по умолчанию
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('sess-date').value = today;
}

function closeModal() {
  document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('open'));
  document.body.style.overflow = '';
}

function addStudent() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) { alert('Введите имя ученика'); return; }

  const student = {
    id: Date.now(),
    name,
    age: document.getElementById('s-age').value.trim(),
    goal: document.getElementById('s-goal').value.trim(),
    notes: document.getElementById('s-notes').value.trim(),
    color: COLORS[students.length % COLORS.length],
    plan: '',
    assignedGames: [],
    sessions: [],
    createdAt: new Date().toLocaleDateString('ru-RU'),
  };

  students.push(student);
  save();
  closeModal();
  ['s-name','s-age','s-goal','s-notes'].forEach(id => document.getElementById(id).value='');
  renderSidebar();
  selectStudent(student.id);
  showToast('✅ Ученик «' + name + '» добавлен!');
}

function deleteStudent(id) {
  if (!confirm('Удалить ученика и все его данные?')) return;
  students = students.filter(s => s.id !== id);
  save();
  currentStudentId = null;
  renderSidebar();
  document.getElementById('empty-state').style.display = 'block';
  document.getElementById('student-profile').style.display = 'none';
}

function renderSidebar() {
  const el = document.getElementById('students-list');
  if (!students.length) {
    el.innerHTML = '<p style="text-align:center;color:var(--gray);padding:24px;font-size:13px;font-weight:600;">Учеников пока нет</p>';
    return;
  }
  el.innerHTML = students.map(s => {
    const doneGames = s.assignedGames.filter(g => g.done).length;
    const totalGames = s.assignedGames.length;
    return `
      <div class="student-card ${s.id === currentStudentId ? 'active' : ''}" onclick="selectStudent(${s.id})">
        <div class="student-avatar ${s.color}">${getInitials(s.name)}</div>
        <div class="student-info">
          <div class="student-name">${s.name}</div>
          <div class="student-meta">${s.age || 'Возраст не указан'} · ${totalGames} игр</div>
        </div>
      </div>`;
  }).join('');
}

function selectStudent(id) {
  currentStudentId = id;
  renderSidebar();
  renderProfile();
}

// ─── ПРОФИЛЬ УЧЕНИКА ──────────────────────────────
function renderProfile() {
  const s = students.find(st => st.id === currentStudentId);
  if (!s) return;

  document.getElementById('empty-state').style.display = 'none';
  const profile = document.getElementById('student-profile');
  profile.style.display = 'block';

  const doneGames = s.assignedGames.filter(g => g.done).length;
  const totalGames = s.assignedGames.length;
  const progress = totalGames > 0 ? Math.round((doneGames/totalGames)*100) : 0;

  profile.innerHTML = `
    <!-- HEADER -->
    <div class="profile-header">
      <div class="profile-avatar ${s.color}">${getInitials(s.name)}</div>
      <div class="profile-info">
        <h2>${s.name}</h2>
        <div class="profile-meta">
          ${s.age ? `<span class="meta-chip">📅 ${s.age}</span>` : ''}
          ${s.goal ? `<span class="meta-chip">🎯 ${s.goal}</span>` : ''}
          <span class="meta-chip">📅 С ${s.createdAt}</span>
          <span class="meta-chip">✅ ${doneGames}/${totalGames} игр</span>
        </div>
      </div>
      <div class="profile-actions">
        <button class="btn-outline" style="font-size:13px;" onclick="deleteStudent(${s.id})">🗑 Удалить</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="profile-tabs">
      <button class="tab-btn ${currentTab==='plan'?'active':''}" onclick="switchTab('plan')">📋 План занятий</button>
      <button class="tab-btn ${currentTab==='games'?'active':''}" onclick="switchTab('games')">🎮 Игры</button>
      <button class="tab-btn ${currentTab==='sessions'?'active':''}" onclick="switchTab('sessions')">📝 Дневник</button>
      <button class="tab-btn ${currentTab==='progress'?'active':''}" onclick="switchTab('progress')">📊 Прогресс</button>
    </div>

    <!-- TAB CONTENT -->
    <div id="tab-content">
      ${renderTab(s)}
    </div>
  `;
}

function switchTab(tab) {
  currentTab = tab;
  const s = students.find(st => st.id === currentStudentId);
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.includes({plan:'План',games:'Игры',sessions:'Дневник',progress:'Прогресс'}[tab])));
  document.getElementById('tab-content').innerHTML = renderTab(s);
}

function renderTab(s) {
  if (currentTab === 'plan') return renderPlanTab(s);
  if (currentTab === 'games') return renderGamesTab(s);
  if (currentTab === 'sessions') return renderSessionsTab(s);
  if (currentTab === 'progress') return renderProgressTab(s);
  return '';
}

// ─── ТАБ: ПЛАН ────────────────────────────────────
function renderPlanTab(s) {
  return `
    <div class="section-card">
      <h3>📋 Индивидуальный план занятий
        <span class="saved-badge" id="saved-badge">✅ Сохранено</span>
      </h3>
      ${s.notes ? `<div style="background:var(--yellow-pale);border:1.5px solid #fcd34d;border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:14px;font-weight:600;color:#92400e;">📌 ${s.notes}</div>` : ''}
      <textarea class="plan-textarea" id="plan-text" placeholder="Запишите план занятий для ${s.name}...

Например:
• Автоматизация звука Р в слогах
• Упражнение «Моторчик» — 5 минут
• Игра «Кладовая ведьмы» — слова со звуком Ж
• Домашнее задание: повторить 5 слов...">${s.plan || ''}</textarea>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
        <button class="save-btn" onclick="savePlan()">💾 Сохранить план</button>
        <span style="font-size:13px;color:var(--gray);font-weight:600;">Ctrl+S для быстрого сохранения</span>
      </div>
    </div>

    <div class="section-card">
      <h3>🎯 Цель занятий</h3>
      <input type="text" id="goal-input"
        value="${s.goal || ''}"
        placeholder="Укажите главную цель занятий..."
        style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:'Nunito',sans-serif;font-weight:600;outline:none;"
        onfocus="this.style.borderColor='var(--pink)'" onblur="this.style.borderColor='var(--border)'">
      <button class="save-btn" style="margin-top:12px;" onclick="saveGoal()">💾 Сохранить цель</button>
    </div>
  `;
}

function savePlan() {
  const s = students.find(st => st.id === currentStudentId);
  s.plan = document.getElementById('plan-text').value;
  save();
  const badge = document.getElementById('saved-badge');
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 2000);
}

function saveGoal() {
  const s = students.find(st => st.id === currentStudentId);
  s.goal = document.getElementById('goal-input').value;
  save();
  showToast('✅ Цель сохранена!');
  renderProfile();
}

// Ctrl+S сохранение
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    const planArea = document.getElementById('plan-text');
    if (planArea) savePlan();
  }
});

// ─── ТАБ: ИГРЫ ────────────────────────────────────
function renderGamesTab(s) {
  const gameOptions = games.map(g =>
    `<option value="${g.id}">${g.title} (${g.url ? '✓ есть ссылка' : '⚠ нет ссылки'})</option>`
  ).join('');

  const gamesList = s.assignedGames.length ? s.assignedGames.map((ag, idx) => {
    const gameData = games.find(g => g.id == ag.gameId);
    return `
      <div class="assigned-game">
        <div class="game-status ${ag.done ? 'done' : 'pending'}" onclick="toggleGameDone(${idx})" title="${ag.done ? 'Отметить как не выполнено' : 'Отметить как выполнено'}">
          ${ag.done ? '✓' : '○'}
        </div>
        <div class="game-info">
          <div class="game-name ${ag.done ? 'style="text-decoration:line-through;color:var(--gray)"' : ''}">${ag.title}</div>
          <div class="game-cat-label">${ag.catLabel || ''} ${ag.done ? '· ✅ Выполнено' : ''}</div>
        </div>
        ${ag.url ? `<a href="${ag.url}" target="_blank" class="play-link">▶ Играть</a>` : ''}
        <button class="game-remove" onclick="removeGame(${idx})" title="Убрать игру">✕</button>
      </div>`;
  }).join('') : '<p style="color:var(--gray);font-size:14px;font-weight:600;padding:8px 0;">Игры ещё не добавлены</p>';

  return `
    <div class="section-card">
      <h3>🎮 Список игр для занятий</h3>
      <div class="games-assigned" id="games-assigned">
        ${gamesList}
      </div>
      <div class="add-game-wrap">
        <select class="game-select" id="game-select-input">
          <option value="">— Выбрать игру из каталога —</option>
          ${gameOptions}
        </select>
        <button class="add-game-btn" onclick="assignGame()">➕ Добавить игру</button>
      </div>
      ${!games.length ? `<p style="font-size:13px;color:var(--gray);margin-top:8px;font-weight:600;">⚠ Сначала добавьте игры через <a href="admin.html" style="color:var(--pink);">Управление</a></p>` : ''}
    </div>
  `;
}

function assignGame() {
  const s = students.find(st => st.id === currentStudentId);
  const gameId = document.getElementById('game-select-input').value;
  if (!gameId) return;
  const game = games.find(g => g.id == gameId);
  if (!game) return;
  if (s.assignedGames.find(g => g.gameId == gameId)) {
    showToast('⚠ Эта игра уже добавлена!');
    return;
  }
  s.assignedGames.push({
    gameId: game.id,
    title: game.title,
    catLabel: game.catLabel || '',
    url: game.url || '',
    done: false,
  });
  save();
  renderProfile();
  switchTab('games');
  showToast('✅ Игра добавлена!');
}

function toggleGameDone(idx) {
  const s = students.find(st => st.id === currentStudentId);
  s.assignedGames[idx].done = !s.assignedGames[idx].done;
  save();
  switchTab('games');
}

function removeGame(idx) {
  const s = students.find(st => st.id === currentStudentId);
  s.assignedGames.splice(idx, 1);
  save();
  switchTab('games');
}

// ─── ТАБ: ДНЕВНИК ─────────────────────────────────
function renderSessionsTab(s) {
  const sessions = [...(s.sessions || [])].reverse();
  const sessionsList = sessions.length ? sessions.map((sess, idx) => `
    <div class="session-item">
      <div class="session-date">📅 ${sess.date}</div>
      <div class="session-text">${sess.text.replace(/\n/g, '<br>')}</div>
      <button onclick="deleteSession(${s.sessions.length - 1 - idx})" style="margin-top:10px;background:none;border:none;color:#ccc;font-size:12px;cursor:pointer;font-weight:700;" onmouseover="this.style.color='#e55'" onmouseout="this.style.color='#ccc'">✕ Удалить запись</button>
    </div>
  `).join('') : '<p style="color:var(--gray);font-size:14px;font-weight:600;">Записей пока нет</p>';

  const today = new Date().toISOString().split('T')[0];

  return `
    <div class="section-card">
      <h3>📝 Дневник занятий</h3>
      <div class="add-session-wrap">
        <div style="display:flex;gap:12px;margin-bottom:12px;">
          <input type="date" id="new-sess-date" value="${today}"
            style="padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'Nunito',sans-serif;font-weight:600;outline:none;">
        </div>
        <textarea id="new-sess-text" class="plan-textarea" rows="4"
          placeholder="Опишите что делали на занятии, результаты, замечания..."></textarea>
        <button class="save-btn" style="margin-top:12px;" onclick="addSession()">💾 Добавить запись</button>
      </div>
    </div>
    <div class="section-card">
      <h3>📚 История занятий (${sessions.length})</h3>
      ${sessionsList}
    </div>
  `;
}

function addSession() {
  const s = students.find(st => st.id === currentStudentId);
  const text = document.getElementById('new-sess-text').value.trim();
  const date = document.getElementById('new-sess-date').value;
  if (!text) { alert('Введите описание занятия'); return; }
  if (!s.sessions) s.sessions = [];
  const dateFormatted = new Date(date).toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'});
  s.sessions.push({ date: dateFormatted, text });
  save();
  switchTab('sessions');
  showToast('✅ Запись добавлена!');
}

function deleteSession(idx) {
  if (!confirm('Удалить запись?')) return;
  const s = students.find(st => st.id === currentStudentId);
  s.sessions.splice(idx, 1);
  save();
  switchTab('sessions');
}

// ─── ТАБ: ПРОГРЕСС ────────────────────────────────
function renderProgressTab(s) {
  const total = s.assignedGames.length;
  const done = s.assignedGames.filter(g => g.done).length;
  const progress = total > 0 ? Math.round((done/total)*100) : 0;
  const sessions = (s.sessions || []).length;

  return `
    <div class="section-card">
      <h3>📊 Прогресс ученика</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
        <div style="background:var(--pink-pale);border-radius:16px;padding:20px;text-align:center;">
          <div style="font-family:'Unbounded',sans-serif;font-size:32px;font-weight:900;color:var(--pink);">${done}</div>
          <div style="font-size:13px;font-weight:700;color:var(--gray);margin-top:4px;">Игр выполнено</div>
        </div>
        <div style="background:var(--green-pale);border-radius:16px;padding:20px;text-align:center;">
          <div style="font-family:'Unbounded',sans-serif;font-size:32px;font-weight:900;color:var(--green);">${sessions}</div>
          <div style="font-size:13px;font-weight:700;color:var(--gray);margin-top:4px;">Занятий проведено</div>
        </div>
        <div style="background:var(--blue-pale);border-radius:16px;padding:20px;text-align:center;">
          <div style="font-family:'Unbounded',sans-serif;font-size:32px;font-weight:900;color:var(--blue);">${progress}%</div>
          <div style="font-size:13px;font-weight:700;color:var(--gray);margin-top:4px;">Игр пройдено</div>
        </div>
      </div>
      <div style="margin-bottom:8px;font-weight:700;font-size:14px;">Прогресс по играм: ${done} из ${total}</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" style="width:${progress}%"></div>
      </div>
      <div class="progress-label">${progress}% выполнено</div>
    </div>

    <div class="section-card">
      <h3>🎮 Статус игр</h3>
      ${s.assignedGames.length ? s.assignedGames.map(ag => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:18px;">${ag.done ? '✅' : '⏳'}</span>
          <span style="font-weight:700;font-size:14px;flex:1;">${ag.title}</span>
          <span style="font-size:12px;font-weight:700;color:${ag.done ? 'var(--green)' : 'var(--gray)'}">${ag.done ? 'Выполнено' : 'В процессе'}</span>
        </div>
      `).join('') : '<p style="color:var(--gray);font-size:14px;font-weight:600;">Игры ещё не назначены</p>'}
    </div>
  `;
}

// ─── УТИЛИТЫ ──────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display='none', 2500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Инит
renderSidebar();
if (students.length > 0) selectStudent(students[0].id);
</script>
</body>
</html>
