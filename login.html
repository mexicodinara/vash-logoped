<style>
:root {
  --pink:#E84FA3; --pink-light:#F7A8D4; --pink-pale:#FDE9F4;
  --pink-dark:#C0397E; --text:#1a1a2e; --gray:#6b7280; --border:#f0e6ec;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito',sans-serif; background:linear-gradient(135deg,#FFF0F8,#F0FAFF); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.box { background:white; border-radius:28px; padding:48px 44px; width:100%; max-width:440px; box-shadow:0 20px 60px rgba(232,79,163,0.12); }
.logo { text-align:center; margin-bottom:32px; }
.logo img { height:52px; width:auto; max-width:200px; object-fit:contain; }
.tabs { display:flex; gap:4px; background:#f5f5f5; border-radius:12px; padding:4px; margin-bottom:28px; }
.tab { flex:1; padding:10px; border:none; border-radius:10px; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; cursor:pointer; background:transparent; color:var(--gray); transition:all 0.2s; }
.tab.active { background:white; color:var(--pink); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.form-group { margin-bottom:16px; }
label { display:block; font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px; }
input { width:100%; padding:14px 18px; border:1.5px solid var(--border); border-radius:12px; font-size:15px; font-family:'Nunito',sans-serif; font-weight:600; outline:none; transition:border-color 0.2s; }
input:focus { border-color:var(--pink); }
.btn { width:100%; padding:15px; background:linear-gradient(135deg,var(--pink),var(--pink-dark)); border:none; border-radius:50px; color:white; font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; cursor:pointer; margin-top:8px; transition:transform 0.2s; box-shadow:0 4px 14px rgba(232,79,163,0.4); }
.btn:hover { transform:translateY(-1px); }
.msg { padding:12px 16px; border-radius:12px; font-size:14px; font-weight:700; margin-bottom:16px; display:none; }
.msg.error { background:#fff0f0; border:1.5px solid #fca5a5; color:#dc2626; }
.msg.success { background:#e8f8f1; border:1.5px solid #b2f0e0; color:#1a9e78; }
.hint { text-align:center; font-size:13px; color:var(--gray); font-weight:600; margin-top:16px; }
.hint a { color:var(--pink); text-decoration:none; font-weight:700; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <a href="index.html"><img src="logo.jpg" alt="Ваш Логопед" onerror="this.style.display='none'"></a>
    <div style="font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;color:var(--pink);margin-top:8px;">Ваш Логопед</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Войти</button>
    <button class="tab" onclick="showTab('register')">Регистрация</button>
  </div>

  <div id="msg" class="msg"></div>

  <!-- ВХОД -->
  <div id="tab-login">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" onclick="doLogin()">Войти →</button>
    <p class="hint"><a href="#" onclick="showForgot()">Забыли пароль?</a></p>
  </div>

  <!-- РЕГИСТРАЦИЯ -->
  <div id="tab-register" style="display:none">
    <div class="form-group">
      <label>Имя</label>
      <input type="text" id="reg-name" placeholder="Ваше имя">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="reg-pass" placeholder="Минимум 6 символов" onkeydown="if(event.key==='Enter')doRegister()">
    </div>
    <button class="btn" onclick="doRegister()">Создать аккаунт →</button>
    <p class="hint" style="margin-top:12px;font-size:12px;">Регистрируясь, вы получаете <strong>3 бесплатные игры</strong></p>
  </div>
</div>

<script>
function showTab(tab) {
  document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('tab-register').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  hideMsg();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}
function hideMsg() { document.getElementById('msg').style.display = 'none'; }

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) { showMsg('Заполните все поля', 'error'); return; }
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { showMsg('Неверный email или пароль', 'error'); return; }
  
  showMsg('Входим...', 'success');
  setTimeout(() => window.location.href = 'catalog.html', 800);
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  
  if (!name || !email || !pass) { showMsg('Заполните все поля', 'error'); return; }
  if (pass.length < 6) { showMsg('Пароль минимум 6 символов', 'error'); return; }
  
  const { data, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { name } }
  });
  
  if (error) { showMsg(error.message, 'error'); return; }
  
  // Обновляем профиль с именем
  if (data.user) {
    await sb.from('profiles').upsert({ id: data.user.id, email, name });
  }
  
  showMsg('✅ Аккаунт создан! Проверьте email для подтверждения.', 'success');
  setTimeout(() => window.location.href = 'catalog.html', 2000);
}

async function showForgot() {
  const email = prompt('Введите ваш email для сброса пароля:');
  if (!email) return;
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if (error) { showMsg('Ошибка: ' + error.message, 'error'); }
  else { showMsg('✅ Письмо отправлено на ' + email, 'success'); }
}

// Проверяем — уже вошёл?
sb.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'catalog.html';
});
</script>
</body>
</html>
